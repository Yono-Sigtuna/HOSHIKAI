<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>星海社 · 重新校准坐标</title>
<!--
  GitHub Pages 没有 Apache 的 RewriteRule，干净的 URL 会落到这份 404 页。
  这里按 v2p/.htaccess 的同一套规则，把路径翻译回对应的 .html?参数 再跳转：
    /forum/1-1/2/       -> board.html?b=1-1&p=2
    /topic/t11012f25/   -> topic.html?t=t11012f25
    /space/1/works/2/   -> space.html?u=1&s=works&p=2
    /tag/科幻/2/        -> tag.html?t=科幻&p=2      （查询串原样带上）
    /login/ /search/ …  -> login.html / search.html …
  站点若换仓库名，只需改下面的 HOME 常量。
-->
<style>
  :root{
    --ink:#2a3060; --ink-soft:#4d5578; --ink-faint:#5c6488;
    --line:#d0daff; --gold:#8a6a1f; --gold-lit:#dfbd65;
    --grad:linear-gradient(160deg,#fbfcff 0%,#f3f6ff 45%,#fff8e6 100%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:24px;
    color:var(--ink); background:var(--grad);
    font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.65;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
    background-image:
      radial-gradient(1.5px 1.5px at 18% 22%, #7aa4ff 50%, transparent 51%),
      radial-gradient(1px 1px at 74% 15%, #dfbd65 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 68%, #7aa4ff 50%, transparent 51%),
      radial-gradient(1px 1px at 32% 78%, #bf9a42 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 46%, #b8ccff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 58%, #c5d0ff 50%, transparent 51%);
  }
  .box{
    position:relative; width:min(560px,100%); padding:48px 40px 40px;
    background:rgba(255,255,255,.82); border:1px solid var(--line);
    border-radius:16px; box-shadow:0 12px 32px -8px rgba(30,63,192,.18);
    text-align:center; backdrop-filter:blur(6px);
  }
  .dial{width:104px;height:104px;margin:0 auto 22px;display:block;color:#4a72e8}
  .dial .orbit{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.55}
  .dial .core{fill:var(--gold-lit)}
  .k{
    margin:0 0 10px; font-size:11px; letter-spacing:.22em;
    color:var(--gold); font-weight:700;
  }
  h1{
    margin:0 0 12px; font-size:clamp(22px,5vw,28px); line-height:1.3;
    font-family:"Noto Serif JP","Noto Serif SC","Songti SC",serif;
    letter-spacing:.04em;
  }
  p{margin:0 0 8px;color:var(--ink-soft);font-size:14px}
  .actions{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 20px;border-radius:999px;text-decoration:none;font-size:14px;
  }
  a.solid{color:#fff;background:linear-gradient(150deg,#3a63dd,#1e3fc0);box-shadow:0 6px 18px -6px rgba(30,63,192,.5)}
  a.ghost{color:var(--ink-soft);border:1px solid var(--line);background:#fff}
  a:focus-visible{outline:2px solid #4a72e8;outline-offset:3px}
  .fp{margin-top:28px;font-size:12px;color:var(--ink-faint)}
  html.miss .redirecting{display:none}
  html:not(.miss) .fallback{display:none}
</style>
</head>
<body>
<main class="box">
  <svg class="dial" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="orbit" cx="60" cy="60" r="46"/>
    <circle class="orbit" cx="60" cy="60" r="32" stroke-dasharray="3 6"/>
    <ellipse class="orbit" cx="60" cy="60" rx="52" ry="19" transform="rotate(-23 60 60)"/>
    <circle class="core" cx="98" cy="32" r="3.2"/>
  </svg>
  <p class="k">OFF COURSE · 404</p>
  <h1 id="title">正在重新校准坐标</h1>
  <p id="desc">这条航路不在星图上，正在尝试回到最近的观测点。</p>
  <div class="actions">
    <a class="solid" id="home" href="/HOSHIKAI/">回到星海社</a>
    <a class="ghost" href="javascript:history.back()">返回上一页</a>
  </div>
  <p class="fp">星海社 · HOSHIKAI</p>
</main>
<script>
(function () {
  var path = location.pathname;
  var search = location.search;
  var HOME = '/HOSHIKAI/';   // 仓库改名时改这一处

  var rules = [
    [/^(.*?)\/forum\/(\d+-\d+)\/?(\d*)\/?$/, function (m) {
      return { base: m[1] + '/', to: 'board.html?b=' + m[2] + '&p=' + m[3] };
    }],
    [/^(.*?)\/topic\/([A-Za-z0-9_-]+)\/?$/, function (m) {
      return { base: m[1] + '/', to: 'topic.html?t=' + encodeURIComponent(m[2]) };
    }],
    [/^(.*?)\/topic\/?$/, function (m) {
      return { base: m[1] + '/', to: 'topic.html' };
    }],
    [/^(.*?)\/space\/([A-Za-z0-9_-]+)\/([a-z]+)\/?(\d*)\/?$/, function (m) {
      return { base: m[1] + '/', to: 'space.html?u=' + encodeURIComponent(m[2]) + '&s=' + m[3] + '&p=' + m[4] };
    }],
    [/^(.*?)\/space\/([A-Za-z0-9_-]+)\/?$/, function (m) {
      return { base: m[1] + '/', to: 'space.html?u=' + encodeURIComponent(m[2]) };
    }],
    [/^(.*?)\/space\/?$/, function (m) {
      return { base: m[1] + '/', to: 'space.html?u=1' };
    }],
    [/^(.*?)\/tag\/([^/]+)\/?(\d*)\/?$/, function (m) {
      return { base: m[1] + '/', to: 'tag.html?t=' + m[2] + '&p=' + m[3] };
    }],
    [/^(.*?)\/tag\/?$/, function (m) {
      return { base: m[1] + '/', to: 'tag.html' };
    }],
    [/^(.*?)\/(login|register|settings|msg|search|compose|sitemap|admin|rules|links|contact)\/?$/, function (m) {
      return { base: m[1] + '/', to: m[2] + '.html' };
    }]
  ];

  for (var i = 0; i < rules.length; i++) {
    var m = path.match(rules[i][0]);
    if (!m) continue;
    var r = rules[i][1](m);
    if (search) r.to += (r.to.indexOf('?') >= 0 ? '&' : '?') + search.slice(1);
    location.replace(r.base + r.to);
    return;
  }

  // 没匹配到已知航路：停在这里，显示空态，而不是反复跳转。
  document.documentElement.classList.add('miss');
  document.getElementById('title').textContent = '这片天区没有记录';
  document.getElementById('desc').textContent = '你要找的页面不在当前星图上。可能是旧链接，或者它从未被观测过。';
  document.getElementById('home').href = HOME;
})();
</script>
</body>
</html>
