<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发新帖 · 星海社</title>
<script>document.documentElement.classList.add('js')</script>
<script>(function(){try{var t=localStorage.getItem('hoshikai:theme');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<script>window.addEventListener('error',function(e){window.__ERR=(window.__ERR||'')+(e.message||'?')+' @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||0)+' | ';});</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%234a72e8'/%3E%3Ccircle cx='19' cy='5' r='2.4' fill='%23dfbd65'/%3E%3C/svg%3E">
<script>/* 开屏只在本次会话第一次进站播；之后首帧前直接跳过 */
try{if(localStorage.getItem("hoshikai:boot")==="1")document.documentElement.classList.add("boot-skip")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="./fonts/fonts.css">
<link rel="stylesheet" id="fontCss" href="./fonts/fonts.css" media="print" onload="this.media='all'">
<script src="./boot.js" defer></script>
<link rel="stylesheet" href="./style.css">
<!-- forum.css：`.tag` 之外还有板块页那套卡片样式（本地帖在那边显示），这里主要是 `.tag` -->
<link rel="stylesheet" href="./forum.css">
<!-- topic.css：只为 `.tpForm` / `.tpForm__box` 那套输入件。已核实它**全部**规则都挂在 .tp*
     作用域里，没有裸元素选择器，放在这一页不会污染别处。 -->
<link rel="stylesheet" href="./topic.css">
<link rel="stylesheet" href="./compose.css">
<link rel="stylesheet" href="./menu.css">
</head>
<body>

<!-- 开屏：字体没到不进场（逻辑见 boot.js，样式见 style.css 的 .boot 段） -->
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot__box">
    <svg class="boot__dial" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="boot__ring" cx="100" cy="100" r="78"/>
      <circle class="boot__ring boot__ring--i" cx="100" cy="100" r="58"/>
      <ellipse class="boot__ec" cx="100" cy="100" rx="86" ry="32" transform="rotate(-23 100 100)"/>
      <circle class="boot__pl" r="5.5"/>
    </svg>
    <p class="boot__t">星海社<span>正在校准星盘</span></p>
    <div class="boot__bar" aria-hidden="true"></div>
    <p class="boot__s">载入星图字体…</p>
  </div>
</div>

<!-- 页面底：7 层背景图轮播 + 洗色 + 星空 canvas（theme.js 画 #sky）。
     ⚠️ 必须写在 `#sky` **之前**：两者同为 z-index:0，靠文档顺序定先后。
     ⚠️ 这一块**不能省** —— 少了它，页面就变回一张白纸上的表单，
        与其他页不是一个站的东西了（用户 2026-10-18：「背景呢？」）。
     本页不挂 hud.js，所以不会因为 `.bg` 存在而多出「看背景」键。 -->
<div class="bg" aria-hidden="true">
  <span class="bg__l" style="--i:0"></span>
  <span class="bg__l" style="--i:1"></span>
  <span class="bg__l" style="--i:2"></span>
  <span class="bg__l" style="--i:3"></span>
  <span class="bg__l" style="--i:4"></span>
  <span class="bg__l" style="--i:5"></span>
  <span class="bg__l" style="--i:6"></span>
  <span class="bg__wash"></span>
</div>
<canvas id="sky" aria-hidden="true"></canvas>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-stars4" viewBox="0 0 24 24"><g fill="currentColor">    <path d="M15.4 2.6c.5 3.6 2.1 5.2 5.7 5.7-3.6.5-5.2 2.1-5.7 5.7-.5-3.6-2.1-5.2-5.7-5.7 3.6-.5 5.2-2.1 5.7-5.7Z"/>
    <path d="M6.1 10.9c.32 2.3 1.35 3.33 3.65 3.65-2.3.32-3.33 1.35-3.65 3.65-.32-2.3-1.35-3.33-3.65-3.65 2.3-.32 3.33-1.35 3.65-3.65Z"/>
    <circle cx="18.6" cy="14.9" r="1.5"/><circle cx="7.2" cy="20.4" r="1.05"/></g></symbol>
  <!-- 格子条要的两枚望远镜：与 board.html 里那两枚**逐字相同**（发帖页不加载 viewer.js，
       所以不能借 viewer 注入的 #v-tel，得自己在 sprite 里放一份）。 -->
  <symbol id="i-telescope" viewBox="0 0 76 75"><g fill="currentColor">
    <path d="M31 46 L15.5 72.5 L21 72.5 L33 48.5 Z"/><path d="M31 46 L46.5 72.5 L41 72.5 L29 48.5 Z"/>
    <path d="M31 46 L29.4 72.5 L32.6 72.5 L33 48.5 Z"/>
    <rect x="20.5" y="58" width="21" height="3" rx="1.5" transform="rotate(-4 31 59.5)"/>
    <rect x="26" y="36" width="10" height="11.5" rx="1.8"/><rect x="24.5" y="31.5" width="13" height="5.4" rx="1.8"/>
    <g transform="rotate(-31 31 32)"><rect x="10.5" y="27.4" width="45" height="9.4" rx="2"/>
      <rect x="52.5" y="25.2" width="7.6" height="13.8" rx="1.6"/><rect x="4.6" y="29" width="6.2" height="6.2" rx="1.5"/>
      <rect x="22" y="17.6" width="21" height="4.2" rx="1.7"/><rect x="23" y="20.6" width="2.8" height="5.6" rx="1.1"/>
      <rect x="39.4" y="20.6" width="2.8" height="5.6" rx="1.1"/></g></g></symbol>
  <symbol id="i-telescope-tile" viewBox="0 0 40 40"><g fill="currentColor">
    <g transform="rotate(-32 20 17)"><rect x="4" y="13.4" width="28" height="7.4" rx="1.6"/>
      <rect x="30" y="11.8" width="6" height="10.6" rx="1.4"/><rect x="0.6" y="14.6" width="4.4" height="5" rx="1.2"/></g>
    <rect x="17.2" y="21" width="5.6" height="4.6" rx="1.2"/>
    <path d="M20 24.5 L12.6 38.5 L16.7 38.5 L21 26.4 Z"/><path d="M20 24.5 L27.4 38.5 L23.3 38.5 L19 26.4 Z"/>
    <path d="M20 24.5 L19.2 38.5 L20.8 38.5 L21 26.4 Z"/></g></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16z"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>

  <!-- 正文排版工具的五枚图标：四枚取自站里 HUD 的 k-* 图标集（hud.js），
       一枚新画（k-divide：中间一枚星，两边断开 —— 就是「分割线」那条）。 -->
  <symbol id="k-lockon" viewBox="0 0 24 24"><!-- 剧透：观测框夹住一枚星芒 —— 「先别看见」 -->
    <path d="M3.6 7.8V5.4A1.8 1.8 0 0 1 5.4 3.6h2.4M16.2 3.6h2.4a1.8 1.8 0 0 1 1.8 1.8v2.4M20.4 16.2v2.4a1.8 1.8 0 0 1-1.8 1.8h-2.4M7.8 20.4H5.4a1.8 1.8 0 0 1-1.8-1.8v-2.4"/>
    <path d="M12 8.7l.92 2.38L15.3 12l-2.38.92L12 15.3l-.92-2.38L8.7 12l2.38-.92z"
          fill="currentColor" stroke="none"/></symbol>
  <symbol id="k-atlas" viewBox="0 0 24 24"><!-- 引用：星表 —— 每目一粒星点 + 一条目线 -->
    <circle cx="4.6" cy="7" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="4.6" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="4.6" cy="17" r="1.6" fill="currentColor" stroke="none"/>
    <path d="M8.8 7h11.6M8.8 12h11.6M8.8 17h11.6"/></symbol>
  <symbol id="k-zenith" viewBox="0 0 24 24"><!-- 小标题：天顶 —— 地平线上一条升到天顶记号的线 -->
    <path d="M3.4 20.4h17.2M12 20.4V7.2M9.4 9.8 12 7.2l2.6 2.6"/><circle cx="12" cy="4.4" r="1.4"/></symbol>
  <symbol id="k-finder" viewBox="0 0 24 24"><!-- 跳转：寻星镜的十字丝视场 —— 定位到另一处 -->
    <circle cx="12" cy="12" r="7.4"/><path d="M12 4.6V19.4M4.6 12H19.4"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <!-- 新画：分割 —— 中间一枚星芒，两侧各一段断开的地平线 -->
  <symbol id="k-divide" viewBox="0 0 24 24">
    <path d="M3.2 12h5.4M15.4 12h5.4"/>
    <path d="M12 9.4l.78 2.02L14.8 12l-2.02.78L12 14.8l-.78-2.02L9.2 12l2.02-.78z"
          fill="currentColor" stroke="none"/></symbol>
</svg>

      <a href="./space/1/"><i><svg viewBox="-8 -8 16 16" aria-hidden="true"><path d="M-5 0H5M0-5V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/></svg></i>个人空间</a>

    </nav>
    <div class="tools">

        <svg class="theme-tg__sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
      <a class="btn btn--ghost" href="./login.html">登录</a>
      <a class="btn btn--solid" href="./register.html">注册</a>
    </div>
  </div>
</header>

<main id="top" class="wrap cq">
  <!-- 由 compose.js 注入（?b= 决定预选的子板块）。
       `cq` 不能省：格子条（`.fs`）的格边长按 `cqw` 算，没有容器查询上下文就退回视口宽。 -->
  <div id="cp"></div>
</main>

<footer class="footer">
  <!-- ⚠️ 整块照抄 v3p 首页的 .title：四层背景（CG / 极光 / 星盘 / 流星）+ 内容层 .title__in。
       星盘和菜单的 DOM 由 footer.js 补；.title 里就地写死深底文字令牌，不跟主题走。 -->
  <section class="title" aria-label="站点标题画面">
    <div class="title__bg" aria-hidden="true"></div>
    <div class="title__aur" aria-hidden="true"></div>
    <svg class="dial title__dial" aria-hidden="true"></svg>
    <div class="title__sky" aria-hidden="true"><span class="shoot" style="--x:62%;--y:6%;--a:32deg;--dur:13s;--del:1.5s"></span><span class="shoot" style="--x:78%;--y:18%;--a:28deg;--dur:17s;--del:6.5s"></span><span class="shoot" style="--x:40%;--y:4%;--a:38deg;--dur:19s;--del:11s"></span></div>
    <div class="wrap title__in">
      <div class="title__lead">
        <p class="title__eye">HOSHIKAI<span> · GALGAME OBSERVERS</span> · <span data-logdate></span></p>
        <p class="title__logo"><span class="title__mk"><span class="lt title__c" style="--i:0">星</span><span class="lt title__c" style="--i:1">海</span><span class="lt title__c" style="--i:2">社</span><svg class="title__orb" viewBox="0 0 200 60" aria-hidden="true"><ellipse cx="100" cy="30" rx="96" ry="22"/><circle class="title__moon" r="4"><animateMotion dur="11s" repeatCount="indefinite" path="M4 30a96 22 0 1 0 192 0a96 22 0 1 0-192 0"/></circle></svg></span><span class="title__en">HOSHIKAI · Night Log</span></p>
        <p class="title__tag" data-tagline></p>
        <div class="menuw"><svg class="menu__cst" aria-hidden="true"></svg><ol class="menu">
        <li><a class="menu__i" href="./sitemap/"><span class="menu__k">SITEMAP</span><span class="menu__t">站点地图</span><span class="menu__d">全站页面索引</span></a></li>
        <li><a class="menu__i" href="./rules/"><span class="menu__k">RULES</span><span class="menu__t">版规总则</span><span class="menu__d">观测前先读这个</span></a></li>
        <li><a class="menu__i" href="./links/"><span class="menu__k">LINKS</span><span class="menu__t">友情链接</span><span class="menu__d">邻接的天文台</span></a></li>
        <li><a class="menu__i" href="./contact/"><span class="menu__k">CONTACT</span><span class="menu__t">联系我们</span><span class="menu__d">给理事会发信</span></a></li>
        <li><span class="menu__i is-off" aria-disabled="true"><span class="menu__k">HISTORY</span><span class="menu__t">历史</span><span class="menu__d">观测记录 · 还没做</span></span></li>
        </ol></div>
      </div>
      <dl class="title__sys" aria-label="站点读数">
        <div><dt>观测者</dt><dd data-stat="members">—</dd></div>
        <div><dt>星体</dt><dd data-stat="threads">—</dd></div>
        <div><dt>今夜新帖</dt><dd data-stat="todayPosts">—</dd></div>
        <div><dt>在台</dt><dd data-stat="online">—</dd></div>
      </dl>
      <div class="title__ann">
        <span class="title__plate">理事会<small data-ann-tag></small></span>
        <p class="title__annT"><a href="./board.html?b=1-1" data-ann-title></a></p>
        <p class="title__annB"><span class="sr" data-ann-body></span><span class="tw" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></p>
        <svg class="title__next" viewBox="0 0 10 8" aria-hidden="true"><path d="M0 0l5 8 5-8z" fill="currentColor"/></svg>
      </div>
    </div>
  </section>
  <div class="wrap footer__note">本页为排版设计稿演示 · 数据均为虚构</div>
</footer>

<script src="./shared/data.js"></script>
<script src="./shared/threads.js"></script>
<script src="./session.js"></script>
<script src="./theme.js"></script>
<!-- viewer.js：提供站里那扇浮窗 `.win`（天球坐标网格底 + 格子条标题栏 + 可拖动 + 滚动锁 +
     Esc/✕/遮罩关 + 焦点归还）。正文排版工具用它，不另造。
     它同时注入 `#v-*` 的 sprite（含望远镜两枚），格子条直接可用。 -->
<script src="./viewer.js"></script>
<script src="./compose.js"></script>

<!-- 反向验证的注入点：只有带 `?css=` / `?js=` 时才做任何事，平时一行都不执行。
     与 msg.html / search.html 上那两处逐字同一做法。 -->
<script>(function () {
  var q = new URLSearchParams(location.search);
  var dec = function (s) { return decodeURIComponent(escape(atob(s))); };
  var css = q.get('css'), js = q.get('js');
  if (css) { try { var st = document.createElement('style'); st.textContent = dec(css); document.head.appendChild(st); } catch (e) { console.error('inject css 失败', e); } }
  if (js) { try { (0, eval)(dec(js)); } catch (e) { console.error('inject js 失败', e); } }
})();</script>
<script src="./menu.js"></script>
<script src="./starbtn.js"></script>
<script src="./footer.js"></script>
</body>
